name: Clean up closed pull requests

# When a PR is closed: stop its runs, delete its image and drop its build caches.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    name: Clean up PR #${{ github.event.pull_request.number }}
    # a fork's token is read-only
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 15
    concurrency:
      group: cleanup-pr-${{ github.event.pull_request.number }}
    permissions:
      actions: write # cancel runs and delete caches
      packages: write # delete the PR image
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_ID: ${{ github.run_id }}
    steps:
      # only runs of the pull_request event, not the push run the merge starts on main
      - name: Cancel the runs of the PR
        run: gh run list --branch "$HEAD_REF" --event pull_request --json databaseId,status --jq ".[] | select(.status != \"completed\" and .databaseId != $RUN_ID) | .databaseId" | xargs -r -n1 gh run cancel

      # whole images are deleted; latest, main, main-* and the other PRs' images are protected
      - name: Delete the PR image
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          packages: github-runner-bootc,offline-github-runner-bootc
          use-regex: true
          keep-n-tagged: 0
          exclude-tags: ^(latest|main|main-.*|pr-(?!${{ github.event.pull_request.number }}(-|$)).*)$

      - name: Delete the build caches of the PR
        run: gh cache list --ref "refs/pull/$PR_NUMBER/merge" --limit 100 --json id --jq '.[].id' | xargs -r -n1 gh cache delete
