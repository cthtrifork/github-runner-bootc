name: Lint
on:
  pull_request: # always, the jobs are required checks and take seconds
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "**/*.sh"
      - "*.containerfile"
      - "build_files/**"
      - "tests/**"
      - "system_files/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12 # renovate: datasource=github-releases depName=rhysd/actionlint
  HADOLINT_VERSION: v2.15.1 # renovate: datasource=github-releases depName=hadolint/hadolint

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore actionlint from cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ runner.os }}

      - name: Install actionlint
        if: steps.cache.outputs.cache-hit != 'true'
        run: | #sh
          mkdir -p "$HOME/.local/bin"
          bash <(curl -sSf --retry 5 --retry-all-errors https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash) "${ACTIONLINT_VERSION}" "$HOME/.local/bin"

      - name: Run actionlint
        run: | #sh
          "$HOME/.local/bin/actionlint" -color -shellcheck= -ignore 'unknown permission scope "artifact-metadata"' -ignore 'of "override_image" input is not included in its options' -ignore 'constant expression "false" in condition'

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck (errors only)
        run: | #sh
          mapfile -t files < <(git ls-files '*.sh' 'system_files/usr/libexec/*' 'system_files/usr/bin/*' | while read -r f; do head -n1 "$f" | grep -qE '^#!.*(ba)?sh' && echo "$f"; done)
          [ "${#files[@]}" -gt 0 ] || { echo "No shell scripts yet"; exit 0; }
          shellcheck --severity=error "${files[@]}"

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore hadolint from cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/hadolint
          key: hadolint-${{ env.HADOLINT_VERSION }}-${{ runner.os }}

      - name: Install hadolint
        if: steps.cache.outputs.cache-hit != 'true'
        run: | #sh
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/.local/bin/hadolint" "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          chmod +x "$HOME/.local/bin/hadolint"

      - name: Run hadolint (errors only, ADD is used intentionally)
        run: | #sh
          git ls-files '*.containerfile' | xargs -r "$HOME/.local/bin/hadolint" --failure-threshold error --ignore DL3020

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the token lets zizmor run its online audits
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_VERSION: 1.32.0 # renovate: datasource=pypi depName=zizmor
        run: |
          python3 -m pip install --user "zizmor==${ZIZMOR_VERSION}"
          "$HOME/.local/bin/zizmor" --persona pedantic --format plain .github
