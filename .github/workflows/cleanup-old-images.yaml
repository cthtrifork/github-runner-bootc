name: Clean up old images

# Prunes the ghcr.io packages of the two images.
on:
  schedule:
    - cron: "05 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/cleanup-old-images.yaml"

concurrency:
  group: cleanup-old-images
  cancel-in-progress: false

permissions: {}

env:
  PACKAGE: github-runner-bootc,offline-github-runner-bootc
  # a PR and a manual run are dry runs unless the manual run says otherwise
  DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}

jobs:
  cleanup:
    name: Cleanup images
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      packages: write # delete package versions
    steps:
      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          packages: ${{ env.PACKAGE }}
          delete-untagged: true
          dry-run: ${{ env.DRY_RUN == 'true' }}

      # keep-n-tagged: 0 deletes whole images; delete-tags would unlink tags one by one, which GHCR rejects
      - name: Delete old PR and branch images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          packages: ${{ env.PACKAGE }}
          keep-n-tagged: 0
          exclude-tags: main,main-*,*.*.*-*.*,latest
          older-than: 7 days
          dry-run: ${{ env.DRY_RUN == 'true' }}

      - name: Delete ghost images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          packages: ${{ env.PACKAGE }}
          delete-ghost-images: true
          exclude-tags: main,main-*,*.*.*-*.*,latest
          dry-run: ${{ env.DRY_RUN == 'true' }}

      # younger than 30 days is kept, plus the 5 newest older ones
      - name: Prune old main images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          packages: ${{ env.PACKAGE }}
          keep-n-tagged: 5
          exclude-tags: latest
          older-than: 30 days
          dry-run: ${{ env.DRY_RUN == 'true' }}
