name: Clean up old images

# Prunes the ghcr.io packages of the two images. It holds packages: write, so it never runs on pull_request (a PR could
# edit it and drop the dry run): schedule and manual runs only. To test a change, run it manually; a manual run is a dry
# run unless it says otherwise.
on:
  schedule:
    - cron: "05 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: true

concurrency:
  group: cleanup-old-images
  cancel-in-progress: false

permissions: {}

env:
  PACKAGE: github-runner-bootc,offline-github-runner-bootc
  # a manual run is a dry run unless it says otherwise; the schedule deletes
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  cleanup:
    name: Cleanup images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write # delete package versions
    steps:
      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          token: ${{ github.token }}
          packages: ${{ env.PACKAGE }}
          delete-untagged: true
          dry-run: ${{ env.DRY_RUN == 'true' }}

      # keep-n-tagged: 0 deletes whole images; delete-tags would unlink tags one by one, which GHCR rejects
      - name: Delete old PR and branch images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          token: ${{ github.token }}
          packages: ${{ env.PACKAGE }}
          keep-n-tagged: 0
          exclude-tags: main,main-*,latest-*,latest,sha256-*
          older-than: 7 days
          dry-run: ${{ env.DRY_RUN == 'true' }}

      - name: Delete ghost images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          token: ${{ github.token }}
          packages: ${{ env.PACKAGE }}
          delete-ghost-images: true
          exclude-tags: main,main-*,latest-*,latest,sha256-*
          dry-run: ${{ env.DRY_RUN == 'true' }}

      # younger than 30 days is kept, plus the 5 newest older ones
      - name: Prune old main images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          token: ${{ github.token }}
          packages: ${{ env.PACKAGE }}
          keep-n-tagged: 5
          exclude-tags: latest,sha256-*
          older-than: 30 days
          dry-run: ${{ env.DRY_RUN == 'true' }}
