name: Trivy DB cache

# Refreshes the Trivy vulnerability DB cache on the default branch every day, as the trivy-action
# README recommends. build.yaml restores it (a pull request can read the default branch's caches)
# and sets TRIVY_SKIP_DB_UPDATE, so its scans never download the DB themselves and are not hit by
# registry rate limits. The key and path are the ones trivy-action uses.
# The Java DB is not cached: the scans use only the vuln scanner on OS and library packages.
on:
  schedule:
    - cron: "17 2 * * *" # daily 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-cache
  cancel-in-progress: false

jobs:
  update:
    name: update Trivy DB cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Download the vulnerability DB
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/trivy/db"
          oras pull ghcr.io/aquasecurity/trivy-db:2
          tar -xzf db.tar.gz -C "$GITHUB_WORKSPACE/.cache/trivy/db"
          rm db.tar.gz

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.date.outputs.date }}
