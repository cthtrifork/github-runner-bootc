name: Create disk image

# Builds a bootable raw disk image of a published image, zstd compressed. A manual run on main uploads it to the file
# server of talos-gitops (public downloads from Cloudflare R2) in a separate job. The `disk` PR label only builds.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to install (latest, latest-<runner version>-<date>-<n>, pr-<n>)"
        required: true
        default: latest
        type: string
      variant:
        description: "Which image: default pulls the runner image on the first boot, offline embeds it"
        type: choice
        options: [default, offline]
        default: offline
      authorized_keys:
        description: "Public SSH key(s) for root, one per line (public keys only, never a private key)"
        required: true
        type: string
      disk_size:
        description: "Size of the raw disk"
        required: false
        default: 80G
        type: string
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: create-disk-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disk:
    name: Raw disk image
    # other labels and forks start nothing
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.label.name == 'disk' && github.event.pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read # pull the image
    outputs:
      tag: ${{ env.TAG }}
    env:
      IMAGE_FULL: ${{ inputs.variant == 'default' && format('ghcr.io/{0}', github.repository) || format('ghcr.io/{0}/offline-{1}', github.repository_owner, github.event.repository.name) }}
      TAG: ${{ inputs.tag || format('pr-{0}', github.event.pull_request.number) }}
      DISK_SIZE: ${{ inputs.disk_size || '80G' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authorized keys
        env:
          AUTHORIZED_KEYS: ${{ inputs.authorized_keys }}
        run: | #sh
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9_.-]+$ && "$DISK_SIZE" =~ ^[0-9]+G$ ]] || { echo "::error::bad tag or disk_size"; exit 1; }
          if [ -n "$AUTHORIZED_KEYS" ]; then
            printf '%s\n' "$AUTHORIZED_KEYS" > authorized_keys
            ssh-keygen -l -f authorized_keys >/dev/null
            ! grep -q 'PRIVATE KEY' authorized_keys
          else
            ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/throwaway" && cp "$RUNNER_TEMP/throwaway.pub" authorized_keys
          fi

      - name: Install to a raw disk
        uses: ./.github/actions/install-disk
        with:
          image: ${{ env.IMAGE_FULL }}:${{ env.TAG }}
          authorized_keys_file: authorized_keys
          disk_size: ${{ env.DISK_SIZE }}
          token: ${{ github.token }}

      - name: Compress
        id: size
        run: | #sh
          set -euo pipefail
          cd out
          raw="$(stat -c %s disk.raw)"
          zstd -T0 -3 --sparse -q -o disk.raw.zst disk.raw
          rm -f disk.raw
          bytes="$(stat -c %s disk.raw.zst)"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "### Disk image size
          | | size |
          |---|---|
          | raw (sparse, apparent) | $((raw / 1048576)) MiB |
          | compressed (zstd -3) | $((bytes / 1048576)) MiB |
          " >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        with:
          name: disk-image
          path: out/disk.raw.zst
          compression-level: 0 # already zstd
          retention-days: 1
          if-no-files-found: error

  # Only this job holds the fileserver token (FILESERVER_TOKEN is in the environment of the runner pod, never a repository
  # secret), and it runs nothing but curl on the file the job above built. It is limited to a manual run on main and to
  # the protected environment `file-upload`. The runner is the talos-gitops scale set `arc-files-bootc`: the upload API
  # is cluster-internal. The file is served from the public download host (Cloudflare R2).
  upload:
    name: Upload to the file server
    needs: disk
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: arc-files-bootc
    timeout-minutes: 60
    environment: file-upload
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: disk-image
          path: out

      - name: Upload
        env:
          TAG: ${{ needs.disk.outputs.tag }}
        run: | #sh
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "::error::bad tag"; exit 1; }
          echo "::add-mask::$FILESERVER_TOKEN"
          # in-cluster Service of the file server; the scale set sets it, this is the same address as a fallback
          FILESERVER_URL="${FILESERVER_URL:-http://fileserver-upload.fileserver-system.svc:8082}"
          file="$(ls out/*)"
          name="github-runner-${TAG}-$(date -u +%Y%m%d).raw.zst"
          curl --fail --retry 3 --max-time 3600 -T "$file" -H "Authorization: Bearer $FILESERVER_TOKEN" \
            -H "X-Content-SHA256: $(sha256sum "$file" | cut -d' ' -f1)" \
            "$FILESERVER_URL/v1/files/$name?visibility=public"
          echo "Uploaded \`$name\` (public)" >> "$GITHUB_STEP_SUMMARY"
