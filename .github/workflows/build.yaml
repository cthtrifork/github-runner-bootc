name: Build and test bootc image

# Builds both images and publishes them from main. The PR labels `e2e` (boot in QEMU, the offline image with no network)
# and `e2e-live` (also run a real job on the VM's runner) opt in to the tests; `push` publishes the PR image.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: "Test tier to run after the build"
        type: choice
        options: [none, e2e, e2e-live]
        default: none
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # a label that starts nothing (the iso label, Renovate's labels) must not cancel a running build
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.action != 'labeled' || contains(fromJSON('["e2e","e2e-live","push"]'), github.event.label.name))) }}

env:
  TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  TIER: ${{ (github.event_name == 'workflow_dispatch' && inputs.tier) || (contains(github.event.pull_request.labels.*.name, 'e2e-live') && 'e2e-live') || (contains(github.event.pull_request.labels.*.name, 'e2e') && 'e2e') || 'none' }}
  # a PR image is pushed only when a label asks for it, never from a fork
  PUSH: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork != true && (contains(github.event.pull_request.labels.*.name, 'push') || contains(github.event.pull_request.labels.*.name, 'e2e') || contains(github.event.pull_request.labels.*.name, 'e2e-live'))) }}

jobs:
  # A push to main builds, and so releases, only when the image changed. A PR also builds when the tests or the build
  # workflow changed. The weekly run builds only when the base image is newer or the published image is 14 days old.
  gate:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the files of the pull request
    outputs:
      build: ${{ steps.gate.outputs.build == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.image == 'true' || (github.event_name == 'pull_request' && steps.changes.outputs.ci == 'true')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Changed files
        id: changes
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ${{ github.token }}
          filters: |
            image:
              - github-runner.containerfile
              - system_files/**
            ci:
              - tests/**
              - .github/workflows/build.yaml
              - .github/actions/**
              - .github/scripts/**

      - name: Gate
        id: gate
        run: .github/scripts/image-needs-rebuild.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}

  build:
    name: Build ${{ matrix.variant }} image
    needs: gate
    # other labels (Renovate adds several) start nothing
    if: ${{ needs.gate.outputs.build == 'true' && (github.event.action != 'labeled' || contains(fromJSON('["e2e","e2e-live","push"]'), github.event.label.name)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            image: ghcr.io/${{ github.repository }}
            embed: "false"
          - variant: offline
            image: ghcr.io/${{ github.repository_owner }}/offline-${{ github.event.repository.name }}
            embed: "true"
    env:
      IMAGE: ${{ matrix.image }}
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # provenance attestation
      attestations: write # provenance attestation
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ env.TAG }}
      tier: ${{ env.TIER }}
      pushed: ${{ env.PUSH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ env.PUSH == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main-{{date 'YYYYMMDD'}}-${{ github.run_number }},enable={{is_default_branch}}
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            containers.bootc=1
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: github-runner.containerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: EMBED_RUNNER_IMAGE=${{ matrix.embed }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # report only: the weekly rebuild picks fixes up
      - name: Trivy scan
        if: ${{ env.PUSH == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"
          timeout: 15m
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}

      - name: Attest build provenance
        if: ${{ env.PUSH == 'true' && github.event_name != 'pull_request' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The offline image boots with only the SSH forward reachable (the airgap test); e2e-live then boots it again with a
  # network, seeds the GitHub App and lets the VM register a runner for the `live job`.
  e2e:
    name: E2E ${{ matrix.variant }} (${{ needs.build.outputs.tier }})
    needs: build
    if: ${{ needs.build.outputs.tier != 'none' && needs.build.outputs.pushed == 'true' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            image: ghcr.io/${{ github.repository }}
            restricted: false
          - variant: offline
            image: ghcr.io/${{ github.repository_owner }}/offline-${{ github.event.repository.name }}
            restricted: true
    permissions:
      contents: read
      packages: read # pull the image that the build job pushed
      actions: write # cancel the run when the VM fails, so the live job does not wait for a runner
    env:
      IMAGE: ${{ matrix.image }}
      LIVE: ${{ needs.build.outputs.tier == 'e2e-live' && matrix.restricted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ephemeral SSH key
        run: mkdir -p out && ssh-keygen -q -t ed25519 -N "" -f out/ci_ssh_key && cp out/ci_ssh_key.pub out/authorized_keys

      - name: Install to a raw disk
        id: disk
        uses: ./.github/actions/install-disk
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          authorized_keys_file: out/authorized_keys
          token: ${{ github.token }}

      - name: Boot (restricted network for the offline image, the airgap test)
        uses: ./.github/actions/boot-vm
        with:
          disk: ${{ steps.disk.outputs.path }}
          ssh_key: out/ci_ssh_key
          network: ${{ matrix.restricted && 'restricted' || 'open' }}

      - name: System tests
        run: tests/vm-ssh.sh bash -s < tests/system-test.sh

      - name: Save the journal and stop the VM
        if: ${{ always() }}
        run: tests/vm-stop.sh first

      - name: The offline journal has no registry lookups
        if: ${{ matrix.restricted }}
        run: "! grep -iE 'pinging container registry|unable to pull|Trying to pull' out/journal/first.log"

      - name: Boot with a network (live tier)
        if: ${{ env.LIVE == 'true' }}
        uses: ./.github/actions/boot-vm
        with:
          disk: ${{ steps.disk.outputs.path }}
          ssh_key: out/ci_ssh_key
          network: open
          memory: 8G

      - name: GitHub App token (to remove the test runner afterwards)
        id: app-token
        if: ${{ env.LIVE == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RUNNER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write

      - name: Seed the App and start the runner
        if: ${{ env.LIVE == 'true' }}
        run: tests/live-test.sh seed
        env:
          RUN_ID: ${{ github.run_id }}
          RUNNER_APP_CLIENT_ID: ${{ vars.RUNNER_APP_CLIENT_ID }}
          RUNNER_INSTALLATION_ID: ${{ vars.RUNNER_INSTALLATION_ID }}
          RUNNER_APP_PRIVATE_KEY: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}

      - name: Wait until the live job has run on the VM
        if: ${{ env.LIVE == 'true' }}
        timeout-minutes: 12
        run: tests/live-test.sh wait
        env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Remove the test runner and stop the VM
        if: ${{ always() && env.LIVE == 'true' }}
        run: tests/live-test.sh cleanup; tests/vm-stop.sh live
        env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Journals in the summary
        if: ${{ always() }}
        run: for f in out/journal/*.log; do printf '<details><summary>%s</summary>\n\n```\n' "$f"; tail -n 200 "$f"; printf '```\n</details>\n'; done | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cancel the run when the VM test failed
        if: ${{ failure() && env.LIVE == 'true' }}
        run: gh run cancel "$GITHUB_RUN_ID" || true
        env:
          GH_TOKEN: ${{ github.token }}

  # runs on the runner the VM registers; the unique label keeps other workflows off it
  live-job:
    name: live job
    needs: build
    if: ${{ needs.build.outputs.tier == 'e2e-live' && needs.build.outputs.pushed == 'true' && github.event.pull_request.head.repo.fork != true && github.event.pull_request.draft != true }}
    runs-on: [self-hosted, "e2e-${{ github.run_id }}"]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Where am I running
        run: id && uname -a && podman info --format '{{.Host.OCIRuntime.Name}} {{.Store.GraphDriverName}}'

      - name: Podman works inside the runner
        run: printf 'FROM scratch\nCOPY hello /hello\n' > Containerfile && echo hello > hello && buildah bud -t localhost/live-test:1 . && podman images localhost/live-test

  # Every build of main (a merge, the weekly schedule, a manual run) publishes a release named like the image tag, with
  # notes drafted from the merged pull request titles.
  release:
    name: Release
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pushed == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write # create the release and its tag
      pull-requests: read # the merged pull requests since the last release
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          tag: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          commitish: ${{ github.sha }}
          publish: true
