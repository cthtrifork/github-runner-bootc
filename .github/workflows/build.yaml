name: Build and test bootc image

# Builds both images and publishes them from main. The PR labels `e2e` (boot in QEMU, the offline image with no network)
# and `e2e-live` (also run a real job on the VM's runner) opt in to the tests; `push` publishes the PR image.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: "Test tier to run after the build"
        type: choice
        options: [none, e2e, e2e-live]
        default: none
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # a label that starts nothing (the iso label, Renovate's labels) must not cancel a running build
  # a push to main is never cancelled: its build is what publishes the image and the release
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || contains(fromJSON('["e2e","e2e-live","push"]'), github.event.label.name)) }}

env:
  TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  TIER: ${{ (github.event_name == 'workflow_dispatch' && inputs.tier) || (contains(github.event.pull_request.labels.*.name, 'e2e-live') && 'e2e-live') || (contains(github.event.pull_request.labels.*.name, 'e2e') && 'e2e') || 'none' }}
  # images are pushed from main (a merge, the weekly run, a manual run); a PR image only when a label asks for it, never from a fork
  PUSH: ${{ github.ref == 'refs/heads/main' || (github.event.pull_request.head.repo.fork != true && (contains(github.event.pull_request.labels.*.name, 'push') || contains(github.event.pull_request.labels.*.name, 'e2e') || contains(github.event.pull_request.labels.*.name, 'e2e-live'))) }}
  TRIVY_VERSION: v0.76.2 # renovate: datasource=github-releases depName=aquasecurity/trivy
  # The DB comes from the cache that trivy-cache.yaml refreshes daily.
  TRIVY_SKIP_DB_UPDATE: "true"
  # no update check or telemetry calls from the scans
  TRIVY_SKIP_VERSION_CHECK: "true"
  TRIVY_DISABLE_TELEMETRY: "true"

jobs:
  # A push to main builds, and so releases, only when the image files changed since the commit the published images were
  # built from (so a cancelled or failed build is retried by the next push). A PR builds when the image files changed, or
  # when the tests or the build workflow did. The weekly run builds only when the base image is newer or the published
  # image is 14 days old.
  gate:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # the revision label of the published images
    outputs:
      # latest-<runner version>-<YYYYMMDD>-<revision>: the tag of both images of a release, and the release name
      version: ${{ steps.version.outputs.version }}
      runner_version: ${{ steps.version.outputs.runner_version }}
      build: ${{ (github.event_name == 'push' && (steps.gate.outputs.build == 'true' || steps.since_default.outputs.any_changed == 'true' || steps.since_offline.outputs.any_changed == 'true')) || (github.event_name != 'push' && steps.gate.outputs.build == 'true' && (github.event_name != 'pull_request' || steps.changes.outputs.image_any_changed == 'true' || steps.changes.outputs.ci_any_changed == 'true')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the gate compares HEAD with the commit the published image was built from

      - name: Changed files
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            image:
              - github-runner.containerfile
              - system_files/**
            ci:
              - tests/**
              - .github/workflows/build.yaml
              - .github/actions/**
              - .github/scripts/**

      - name: Release version
        id: version
        run: .github/scripts/release-version.sh
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          OFFLINE_IMAGE: ghcr.io/${{ github.repository_owner }}/offline-${{ github.event.repository.name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}

      - name: Gate
        id: gate
        run: .github/scripts/image-needs-rebuild.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          OFFLINE_IMAGE: ghcr.io/${{ github.repository_owner }}/offline-${{ github.event.repository.name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}

      # the image files that changed since each published image was built, so a lost build is retried
      - name: Changed since the default image
        id: since_default
        if: ${{ github.event_name == 'push' && steps.gate.outputs.default_rev != '' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          base_sha: ${{ steps.gate.outputs.default_rev }}
          files: |
            github-runner.containerfile
            system_files/**

      - name: Changed since the offline image
        id: since_offline
        if: ${{ github.event_name == 'push' && steps.gate.outputs.offline_rev != '' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          base_sha: ${{ steps.gate.outputs.offline_rev }}
          files: |
            github-runner.containerfile
            system_files/**

  build:
    name: Build ${{ matrix.variant }} image
    needs: gate
    # other labels (Renovate adds several) start nothing
    if: ${{ needs.gate.outputs.build == 'true' && (github.event.action != 'labeled' || contains(fromJSON('["e2e","e2e-live","push"]'), github.event.label.name)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            image: ghcr.io/${{ github.repository }}
            embed: "false"
          - variant: offline
            image: ghcr.io/${{ github.repository_owner }}/offline-${{ github.event.repository.name }}
            embed: "true"
    env:
      IMAGE: ${{ matrix.image }}
    # Read-only on purpose: this job runs the build action of the pull request itself, so it must not hold a token that can
    # write packages or attestations. The `publish` job below pushes what this one built.
    permissions:
      contents: read
    outputs:
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ env.TAG }}
      tier: ${{ env.TIER }}
      pushed: ${{ env.PUSH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: More disk for container storage
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main (the action has no tags) # zizmor: ignore[stale-action-refs]
        with:
          target-dir: /var/lib/containers

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.gate.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            containers.bootc=1
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.runner-version=${{ needs.gate.outputs.runner_version }}

      - name: Build and rechunk
        uses: ./.github/actions/build-chunked-image
        with:
          containerfile: github-runner.containerfile
          embed: ${{ matrix.embed }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: "false"

      # handed to the publish job, which is the only one that can push
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.PUSH == 'true' }}
        with:
          name: image-${{ matrix.variant }}
          path: ${{ runner.temp }}/chunked/img
          compression-level: 0 # the layers are compressed already
          retention-days: 1
          if-no-files-found: error

  # Pushes the image the build job made, then scans, attests and reports on it. The only job with write access to the
  # packages and the attestations. It never runs code from the checkout (no checkout, no local actions). A pull request
  # reaches it only when a label asks for the PR image (`push`, `e2e`, `e2e-live`). The environment is where the repository
  # settings put required reviewers and a branch rule: `publish` for main and the weekly run, `publish-pr` for pull requests.
  publish:
    name: Publish ${{ matrix.variant }} image
    needs: [gate, build]
    if: ${{ needs.build.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'pull_request' && 'publish-pr' || 'publish' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            image: ghcr.io/${{ github.repository }}
          - variant: offline
            image: ghcr.io/${{ github.repository_owner }}/offline-${{ github.event.repository.name }}
    env:
      IMAGE: ${{ matrix.image }}
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # sign the provenance attestation (OIDC)
      attestations: write # store the provenance attestation
      security-events: write # upload the Trivy SARIF to code scanning
      pull-requests: write # sticky Trivy summary comment
    steps:
      - name: More disk for container storage
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main (the action has no tags) # zizmor: ignore[stale-action-refs]
        with:
          target-dir: /var/lib/containers

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.variant }}
          path: ${{ runner.temp }}/chunked/img

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.gate.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: | #sh
          set -euo pipefail
          for tag in $TAGS; do
            skopeo copy --digestfile "$RUNNER_TEMP/digest" "oci:$RUNNER_TEMP/chunked/img" "docker://$tag"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"

      # Signs the pushed digest with the repository's cosign key. The signature is a `.sig` tag in the registry, which podman and
      # bootc check with a sigstoreSigned policy (docs/signing.md). The key is a secret of the `publish` environment (main only),
      # so a pull request build never has it and is not signed.
      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4 # keep legacy signature format for containers/image

      - name: Sign the image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: | #sh
          set -euo pipefail
          # the hosts refuse an unsigned image of ours (/etc/containers/policy.json), so an unsigned build must fail, not ship
          [[ -n "$COSIGN_PRIVATE_KEY" ]] || { echo "::error::COSIGN_PRIVATE_KEY is not set in the environment publish: the image cannot be signed"; exit 1; }
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            --new-bundle-format=false \
            --use-signing-config=false \
            --registry-referrers-mode=legacy \
            "$IMAGE@$DIGEST"
          echo "Signed \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      # All CRITICAL/HIGH vulnerabilities, including ones with no fix yet; report only (the weekly rebuild picks fixes up), so a new CVE in a base package does not turn every PR red.
      - name: Trivy scan
        if: ${{ env.PUSH == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          scanners: vuln
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          exit-code: "0"
          timeout: 15m
          version: ${{ env.TRIVY_VERSION }}
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}

      # One scan, rendered twice: SARIF for code scanning, the JSON for the PR comment.
      - name: Convert Trivy results to SARIF
        if: ${{ env.PUSH == 'true' }}
        run: trivy convert --format sarif --output trivy.sarif trivy.json

      - name: Upload Trivy results to code scanning
        if: ${{ !cancelled() && env.PUSH == 'true' && github.event.pull_request.head.repo.fork != true && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.variant }}

      - name: Write Trivy comment
        if: ${{ github.event_name == 'pull_request' && env.PUSH == 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VARIANT: ${{ matrix.variant }}
        run: | #sh
          crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy.json)
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy.json)
          os_scanned=$(jq '[.Results[]? | select(.Class=="os-pkgs")] | length' trivy.json)
          {
            echo "### 🛡️ Trivy summary for ${VARIANT}"
            echo ""
            echo "\`${IMAGE}@${DIGEST}\`"
            echo ""
            echo "| Severity | Count |"
            echo "| --- | --- |"
            echo "| 🔴 CRITICAL | ${crit} |"
            echo "| 🟠 HIGH | ${high} |"
            echo ""
            if [[ "$os_scanned" -eq 0 ]]; then
              echo "⚠️ **OS packages were NOT scanned:** Trivy has no advisories for Fedora, so only library/language findings are counted."
              echo ""
            fi
            echo "[Full run](${RUN_URL})"
          } > trivy-comment.md

      - name: Sticky PR comment (Trivy summary)
        if: ${{ github.event_name == 'pull_request' && env.PUSH == 'true' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: trivy-comment.md
          header: "🛡️ Trivy summary for ${{ matrix.variant }}"

      # Compare the PR image with the published :latest (size, layers, new/fixed CRITICAL/HIGH).
      - name: Pull the published baseline
        id: baseline
        if: ${{ github.event_name == 'pull_request' && env.PUSH == 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: | #sh
          if ! docker pull -q "$IMAGE:latest" > /dev/null 2>&1; then
            echo "No $IMAGE:latest yet, skipping the baseline comparison"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          docker pull -q "$IMAGE@$DIGEST" > /dev/null

      # Trivy is already set up by the scan above (same version, cached DB).
      - name: Trivy scan of the published image
        if: ${{ steps.baseline.outputs.exists == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          scanners: vuln
          format: json
          output: latest_trivy.json
          severity: CRITICAL,HIGH
          exit-code: "0"
          timeout: 15m
          skip-setup-trivy: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}

      - name: Write image diff comment
        id: diff
        if: ${{ steps.baseline.outputs.exists == 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: | #sh
          set -euo pipefail

          base=$(docker image inspect "$IMAGE:latest" | jq '.[0]')
          pr=$(docker image inspect "$IMAGE@$DIGEST" | jq '.[0]')
          base_size=$(jq -r '.Size // 0' <<<"$base")
          pr_size=$(jq -r '.Size // 0' <<<"$pr")
          delta=$(( pr_size - base_size ))
          delta_h=$(numfmt --to=iec --suffix=B "${delta#-}")
          if   [[ $delta -gt 0 ]]; then trend="+${delta_h}"
          elif [[ $delta -lt 0 ]]; then trend="-${delta_h}"
          else trend="±0"; fi
          ids='[.Results[]?.Vulnerabilities[]? | .VulnerabilityID] | unique[]?'
          new=$(comm -13 <(jq -r "$ids" latest_trivy.json | sort) <(jq -r "$ids" trivy.json | sort))
          fixed=$(comm -23 <(jq -r "$ids" latest_trivy.json | sort) <(jq -r "$ids" trivy.json | sort))
          new_n=$(printf '%s\n' "$new" | grep -c . || true)
          fixed_n=$(printf '%s\n' "$fixed" | grep -c . || true)
          new_top=$(printf '%s\n' "$new" | head -n 5 | paste -sd, -)
          [[ -z "$new_top" ]] && new_top="_none_"

          {
            echo "### 🧾 Image diff for ${VARIANT}"
            echo ""
            echo "**Base:** \`$IMAGE:latest\`"
            echo "**PR:** \`$IMAGE@$DIGEST\`"
            echo ""
            echo "- Created: $(jq -r '.Created // "n/a"' <<<"$base") → $(jq -r '.Created // "n/a"' <<<"$pr")"
            echo "- Size: $(numfmt --to=iec --suffix=B "$base_size") → $(numfmt --to=iec --suffix=B "$pr_size") (**${trend}**)"
            echo "- Layers: $(jq -r '.RootFS.Layers | length' <<<"$base") → $(jq -r '.RootFS.Layers | length' <<<"$pr")"
            echo "- Trivy HIGH/CRIT: +${new_n} / -${fixed_n} (new: ${new_top})"
          } > image-diff.md

      - name: Sticky PR comment (image diff)
        if: ${{ steps.baseline.outputs.exists == 'true' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: image-diff.md
          header: "🧾 Image diff for ${{ matrix.variant }}"

      - name: Generate SBOM
        if: ${{ env.PUSH == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output: sbom.spdx.json
          skip-setup-trivy: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}

      - name: Attest SBOM
        if: ${{ env.PUSH == 'true' && github.event_name != 'pull_request' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        if: ${{ env.PUSH == 'true' && github.event_name != 'pull_request' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The offline image boots with only the SSH forward reachable (the airgap test); e2e-live then boots it again with a
  # network, seeds the GitHub App and lets the VM register a runner for the `live job`.
  e2e:
    name: E2E ${{ matrix.variant }} (${{ needs.build.outputs.tier }})
    needs: [build, publish]
    if: ${{ needs.build.outputs.tier != 'none' && needs.build.outputs.pushed == 'true' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            image: ghcr.io/${{ github.repository }}
            restricted: false
          - variant: offline
            image: ghcr.io/${{ github.repository_owner }}/offline-${{ github.event.repository.name }}
            restricted: true
    permissions:
      contents: read
      packages: read # pull the image that the build job pushed
      actions: write # cancel the run when the VM fails, so the live job does not wait for a runner
    env:
      IMAGE: ${{ matrix.image }}
      LIVE: ${{ needs.build.outputs.tier == 'e2e-live' && matrix.restricted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ephemeral SSH key
        run: mkdir -p out && ssh-keygen -q -t ed25519 -N "" -f out/ci_ssh_key && cp out/ci_ssh_key.pub out/authorized_keys

      - name: Install to a raw disk
        id: disk
        uses: ./.github/actions/install-disk
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          authorized_keys_file: out/authorized_keys
          token: ${{ github.token }}

      - name: Boot (restricted network for the offline image, the airgap test)
        uses: ./.github/actions/boot-vm
        with:
          disk: ${{ steps.disk.outputs.path }}
          ssh_key: out/ci_ssh_key
          network: ${{ matrix.restricted && 'restricted' || 'open' }}

      - name: System tests
        run: tests/vm-ssh.sh bash -s < tests/system-test.sh

      - name: Save the journal and stop the VM
        if: ${{ always() }}
        run: tests/vm-stop.sh first

      - name: The offline journal has no registry lookups
        if: ${{ matrix.restricted }}
        run: "! grep -iE 'pinging container registry|unable to pull|Trying to pull' out/journal/first.log"

      - name: Boot with a network (live tier)
        if: ${{ env.LIVE == 'true' }}
        uses: ./.github/actions/boot-vm
        with:
          disk: ${{ steps.disk.outputs.path }}
          ssh_key: out/ci_ssh_key
          network: open
          memory: 8G

      - name: GitHub App token (to remove the test runner afterwards)
        id: app-token
        if: ${{ env.LIVE == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RUNNER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write

      - name: Seed the App and start the runner
        if: ${{ env.LIVE == 'true' }}
        run: tests/live-test.sh seed
        env:
          RUN_ID: ${{ github.run_id }}
          RUNNER_APP_CLIENT_ID: ${{ vars.RUNNER_APP_CLIENT_ID }}
          RUNNER_INSTALLATION_ID: ${{ vars.RUNNER_INSTALLATION_ID }}
          RUNNER_APP_PRIVATE_KEY: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}

      - name: Wait until the live job has run on the VM
        if: ${{ env.LIVE == 'true' }}
        timeout-minutes: 12
        run: tests/live-test.sh wait
        env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Remove the test runner and stop the VM
        if: ${{ always() && env.LIVE == 'true' }}
        run: tests/live-test.sh cleanup; tests/vm-stop.sh live
        env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Journals in the summary
        if: ${{ always() }}
        run: for f in out/journal/*.log; do printf '<details><summary>%s</summary>\n\n```\n' "$f"; tail -n 200 "$f"; printf '```\n</details>\n'; done | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cancel the run when the VM test failed
        if: ${{ failure() && env.LIVE == 'true' }}
        run: gh run cancel "$GITHUB_RUN_ID" || true
        env:
          GH_TOKEN: ${{ github.token }}

  # runs on the runner the VM registers; the unique label keeps other workflows off it
  live-job:
    name: live job
    needs: [build, publish]
    if: ${{ needs.build.outputs.tier == 'e2e-live' && needs.build.outputs.pushed == 'true' && github.event.pull_request.head.repo.fork != true && github.event.pull_request.draft != true }}
    runs-on: [self-hosted, "e2e-${{ github.run_id }}"]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Where am I running
        run: id && uname -a && docker info --format '{{.ServerVersion}} {{.Driver}}'

      - name: Docker works inside the runner
        run: docker run --rm hello-world

      - name: Containers have a network
        run: docker run --rm alpine:3 wget -q --spider https://github.com

  # Every build of main (a merge, the weekly schedule, a manual run) publishes a release named like the image tag, with
  # notes drafted from the merged pull request titles.
  release:
    name: Release
    needs: [build, publish]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest # needs docker, to list the packages of the two images
    timeout-minutes: 10
    permissions:
      contents: write # create the release and its tag
      pull-requests: read # the merged pull requests since the last release
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          tag: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          commitish: ${{ github.sha }}
          publish: true

      # The notes get the RPM changes since the previous release (default image; the offline one has the same packages)
      # and a link to the SBOM and provenance attestations.
      - name: Add package changes and SBOM to the notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.build.outputs.version }}
        run: | #sh
          packages() { docker run --rm --entrypoint rpm "$IMAGE:$1" -qa --qf '%{NAME} %{VERSION}-%{RELEASE}\n' | sort; }
          previous="$(gh release list --exclude-drafts --limit 2 --json tagName --jq '.[1].tagName // empty')"
          # shellcheck disable=SC2016 # the backticks are markdown
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n## Package changes\n\n'
            if [[ -n "$previous" ]]; then
              packages "$previous" > old.txt
              packages "$TAG" > new.txt
              printf 'Since `%s`:\n\n```diff\n' "$previous"
              diff --unchanged-line-format= --old-line-format='- %L' --new-line-format='+ %L' old.txt new.txt || true
              printf '```\n'
            else
              echo "No previous release to compare with."
            fi
            printf '\n[SBOM and build provenance](%s/%s/attestations)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  # The installer ISOs of the release (default and offline image) replace github-runner-bootc-latest.iso and
  # github-runner-offline-bootc-latest.iso on the file server. They wait for the release, so a failed build or release leaves them as they were.
  iso:
    name: Installer ISO (${{ matrix.variant }})
    needs: [build, release]
    strategy:
      fail-fast: false
      matrix:
        variant: [default, offline]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pushed == 'true' }}
    uses: ./.github/workflows/create-iso.yaml
    permissions:
      contents: read
      packages: read # pull the image
      id-token: write # sign the ISO's provenance attestation (OIDC)
      attestations: write # store it
    with:
      tag: ${{ needs.build.outputs.version }}
      variant: ${{ matrix.variant }}
