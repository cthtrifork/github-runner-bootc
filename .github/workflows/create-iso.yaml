name: Create ISO

# Builds an installer ISO of a published image with bootc-image-builder. A manual run on main, and the release in
# build.yaml (which calls this workflow), upload it to the file server of talos-gitops (public downloads from Cloudflare
# R2) in a separate job: a release uploads `github-runner[-offline]-<version>.iso` and then refreshes `github-runner[-offline]-latest.iso`,
# so a failed build never moves the stable URL. The `iso` PR label instead builds an ISO with an unattended kickstart,
# installs it in QEMU and runs the system tests on the installed disk; the PR image must exist already (labels `push`
# or `e2e` publish it).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to install (latest, <runner version>-<date>.<n>, pr-<n>)"
        required: true
        default: latest
        type: string
      variant:
        description: "Which image: default pulls the runner image on the first boot, offline embeds it"
        type: choice
        options: [default, offline]
        default: default
      refresh_latest:
        description: "Also replace github-runner-latest.iso (a release does; tag it with a release version)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      variant:
        type: string
        default: default
      refresh_latest:
        type: boolean
        default: false
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: create-iso-${{ github.ref }}-${{ inputs.variant || 'pr' }}
  cancel-in-progress: false

jobs:
  iso:
    name: ISO
    # other labels and forks start nothing
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'iso' && github.event.pull_request.head.repo.fork != true) }}
    # pinned: ubuntu-latest (26.04) breaks osbuild's /dev mount
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read # pull the image
    outputs:
      tag: ${{ env.TAG }}
    env:
      IMAGE_FULL: ${{ inputs.variant == 'offline' && format('ghcr.io/{0}/offline-{1}', github.repository_owner, github.event.repository.name) || format('ghcr.io/{0}', github.repository) }}
      TAG: ${{ inputs.tag || format('pr-{0}', github.event.pull_request.number) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: More disk for container storage
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main (the action has no tags) # zizmor: ignore[stale-action-refs]
        with:
          target-dir: /var/lib/containers

      - uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          auth_file_path: ${{ runner.temp }}/auth.json

      - name: Registry credentials for the root podman
        run: sudo install -D -m 600 "$RUNNER_TEMP/auth.json" /root/.config/containers/auth.json

      # a PR builds an ISO with an unattended kickstart and installs it; a manual run builds the interactive one
      - name: Ephemeral SSH key and kickstart
        if: ${{ github.event_name == 'pull_request' }}
        run: mkdir -p out && ssh-keygen -q -t ed25519 -N "" -f out/ci_ssh_key && sed "s|@SSH_KEY@|$(cat out/ci_ssh_key.pub)|" tests/iso-test.toml.in > out/iso-test.toml

      - name: Build the ISO
        id: bib
        uses: ublue-os/bootc-image-builder-action@b98784c42327746e107a6a753b64f44823bdbf2f # main (the action has no tags) # zizmor: ignore[stale-action-refs]
        with:
          config-file: ${{ github.event_name == 'pull_request' && './out/iso-test.toml' || './iso.toml' }}
          type: iso
          rootfs: xfs
          image: ${{ env.IMAGE_FULL }}:${{ env.TAG }}

      - name: Size
        env:
          ISO: ${{ steps.bib.outputs.output-path }}
        run: 'echo "ISO $(basename "$ISO") is $(( $(stat -c %s "$ISO") / 1048576 )) MiB" | tee -a "$GITHUB_STEP_SUMMARY"'

      - name: Install from the ISO, unattended
        if: ${{ github.event_name == 'pull_request' }}
        run: tests/iso-install.sh "$ISO" out/disk.raw
        env:
          ISO: ${{ steps.bib.outputs.output-path }}

      - name: Boot the installed disk
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/boot-vm
        with:
          disk: out/disk.raw
          ssh_key: out/ci_ssh_key
          network: open
          uefi: "true"

      - name: System tests
        if: ${{ github.event_name == 'pull_request' }}
        run: tests/vm-ssh.sh bash -s < tests/system-test.sh

      - name: Save the journal and stop the VM
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: tests/vm-stop.sh iso && tail -n 100 out/journal/iso.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          name: iso-${{ inputs.variant || 'default' }}
          path: ${{ steps.bib.outputs.output-path }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Only this job holds the fileserver token (FILESERVER_TOKEN is in the environment of the runner pod, never a repository
  # secret), and it runs nothing but curl on the file the job above built. It is limited to a manual run on main and to
  # the protected environment `file-upload`. The runner is the talos-gitops scale set `arc-files-bootc`: the upload API
  # is cluster-internal. The file is served from the public download host (Cloudflare R2).
  upload:
    name: Upload to the file server
    needs: iso
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: arc-files-bootc
    timeout-minutes: 60
    environment: file-upload
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-${{ inputs.variant || 'default' }}
          path: out

      - name: Upload
        env:
          TAG: ${{ needs.iso.outputs.tag }}
          REFRESH_LATEST: ${{ inputs.refresh_latest }}
          VARIANT: ${{ inputs.variant || 'default' }}
        run: | #sh
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "::error::bad tag"; exit 1; }
          echo "::add-mask::$FILESERVER_TOKEN"
          # in-cluster Service of the file server; the scale set sets it, this is the same address as a fallback
          FILESERVER_URL="${FILESERVER_URL:-http://fileserver-upload.fileserver-system.svc:8082}"
          file="$(ls out/*)"
          # the default image keeps the plain name; the offline image has `offline` in it
          prefix=github-runner; [[ "$VARIANT" == offline ]] && prefix=github-runner-offline
          # a release tag already carries the date; any other tag gets one so a manual run never replaces the stable name
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}\.[0-9]+$ ]]; then name="${prefix}-${TAG}.iso"; else name="${prefix}-${TAG}-$(date -u +%Y%m%d).iso"; fi
          sha="$(sha256sum "$file" | cut -d' ' -f1)"
          put() { curl --fail --retry 3 --max-time 3600 -T "$file" -H "Authorization: Bearer $FILESERVER_TOKEN" -H "X-Content-SHA256: $sha" "$FILESERVER_URL/v1/files/$1?visibility=public"; }
          put "$name"
          echo "Uploaded \`$name\` (public)" >> "$GITHUB_STEP_SUMMARY"
          # only after the versioned file is in place, and only for a release version
          if [[ "$REFRESH_LATEST" == true && "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}\.[0-9]+$ ]]; then
            put "${prefix}-latest.iso"
            echo "Refreshed \`${prefix}-latest.iso\` to \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          fi
