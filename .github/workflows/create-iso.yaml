name: Create ISO

# Builds an installer ISO of a published image with bootc-image-builder. A manual run on main and the release in
# build.yaml (which calls this workflow) build it on the cluster runner `arc-iso-bootc` (talos-gitops) and upload it from
# there to the file server (public downloads from Cloudflare R2), so the 5 GiB ISO is never downloaded. The file server only
# ever holds `github-runner-bootc-latest.iso` and `github-runner-offline-bootc-latest.iso`: each release replaces its own (atomically),
# and a failed build never touches it. The `iso` PR label instead builds an ISO with an unattended kickstart on a GitHub runner,
# installs it in QEMU and runs the system tests on the installed disk; the PR image must exist already (labels `push`
# or `e2e` publish it).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to install (latest, latest-<runner version>-<date>-<n>, pr-<n>)"
        required: true
        default: latest
        type: string
      variant:
        description: "Which image: default pulls the runner image on the first boot, offline embeds it"
        type: choice
        options: [default, offline]
        default: default
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      variant:
        type: string
        default: default
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: create-iso-${{ github.ref }}-${{ inputs.variant || 'pr' }}
  cancel-in-progress: false

jobs:
  iso:
    name: ISO
    # the PR test only: other labels and forks start nothing (a manual run or a release builds in `publish`)
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'iso' && github.event.pull_request.head.repo.fork != true }}
    # pinned: ubuntu-latest (26.04) breaks osbuild's /dev mount
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read # pull the image
    env:
      IMAGE_FULL: ${{ inputs.variant == 'offline' && format('ghcr.io/{0}/offline-{1}', github.repository_owner, github.event.repository.name) || format('ghcr.io/{0}', github.repository) }}
      TAG: ${{ inputs.tag || format('pr-{0}', github.event.pull_request.number) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: More disk for container storage
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main (the action has no tags) # zizmor: ignore[stale-action-refs]
        with:
          target-dir: /var/lib/containers

      - uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          auth_file_path: ${{ runner.temp }}/auth.json

      - name: Registry credentials for the root podman
        run: sudo install -D -m 600 "$RUNNER_TEMP/auth.json" /root/.config/containers/auth.json

      # a PR builds an ISO with an unattended kickstart and installs it; a manual run builds the interactive one
      - name: Ephemeral SSH key and kickstart
        if: ${{ github.event_name == 'pull_request' }}
        run: mkdir -p out && ssh-keygen -q -t ed25519 -N "" -f out/ci_ssh_key && sed "s|@SSH_KEY@|$(cat out/ci_ssh_key.pub)|" tests/iso-test.toml.in > out/iso-test.toml

      - name: Build the ISO
        id: bib
        uses: ublue-os/bootc-image-builder-action@b98784c42327746e107a6a753b64f44823bdbf2f # main (the action has no tags) # zizmor: ignore[stale-action-refs]
        with:
          config-file: ${{ github.event_name == 'pull_request' && './out/iso-test.toml' || './iso.toml' }}
          type: iso
          rootfs: xfs
          image: ${{ env.IMAGE_FULL }}:${{ env.TAG }}

      - name: Size
        env:
          ISO: ${{ steps.bib.outputs.output-path }}
        run: 'echo "ISO $(basename "$ISO") is $(( $(stat -c %s "$ISO") / 1048576 )) MiB" | tee -a "$GITHUB_STEP_SUMMARY"'

      - name: Install from the ISO, unattended
        if: ${{ github.event_name == 'pull_request' }}
        run: tests/iso-install.sh "$ISO" out/disk.raw
        env:
          ISO: ${{ steps.bib.outputs.output-path }}

      - name: Boot the installed disk
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/boot-vm
        with:
          disk: out/disk.raw
          ssh_key: out/ci_ssh_key
          network: open
          uefi: "true"

      - name: System tests
        if: ${{ github.event_name == 'pull_request' }}
        run: tests/vm-ssh.sh bash -s < tests/system-test.sh

      - name: Save the journal and stop the VM
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: tests/vm-stop.sh iso && tail -n 100 out/journal/iso.log

  # Runs on the cluster runner `arc-iso-bootc` of talos-gitops: privileged, with the file server token in its environment
  # (FILESERVER_TOKEN, never a repository secret). Only a manual run on main or a release reaches it, and the protected
  # environment `file-upload` limits it to main. The ISO is built from the published image and uploaded from the same pod.
  publish:
    name: Build and upload the ISO
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: arc-iso-bootc
    timeout-minutes: 90
    environment: file-upload
    permissions:
      contents: read
    env:
      IMAGE_FULL: ${{ inputs.variant == 'offline' && format('ghcr.io/{0}/offline-{1}', github.repository_owner, github.event.repository.name) || format('ghcr.io/{0}', github.repository) }}
      TAG: ${{ inputs.tag }}
      VARIANT: ${{ inputs.variant || 'default' }}
      # pinned by digest, bump by hand (Renovate does not read this file for it)
      BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder@sha256:dab86ee6b46dcade411b37f4e70b07d93b6a06da0dbfec6fe89247a220e0d9f8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the ISO
        run: | #sh
          set -euo pipefail
          # only a published release becomes the latest ISO: `latest` or a release tag
          [[ "$TAG" == latest || "$TAG" =~ ^latest-[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}-[0-9]+$ ]] || { echo "::error::tag must be latest or a release tag (latest-<runner version>-<date>-<n>)"; exit 1; }
          mkdir -p out
          sudo podman pull -q "$IMAGE_FULL:$TAG"
          sudo podman pull -q "$BIB_IMAGE"
          # /host-dev is the node's live /dev (see the scale set): osbuild needs the loop devices it creates
          sudo podman run --rm --privileged --pull=never --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage -v /host-dev:/dev -v /run/udev:/run/udev:ro \
            -v "$PWD/iso.toml:/config.toml:ro" -v "$PWD/out:/output" \
            "$BIB_IMAGE" --type iso --rootfs xfs --config /config.toml --local "$IMAGE_FULL:$TAG"
          sudo chown -R "$(id -u):$(id -g)" out
          ls -l out/bootiso/install.iso
          echo "ISO is $(( $(stat -c %s out/bootiso/install.iso) / 1048576 )) MiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to the file server
        run: | #sh
          set -euo pipefail
          echo "::add-mask::$FILESERVER_TOKEN"
          # in-cluster Service of the file server; the scale set sets it, this is the same address as a fallback
          FILESERVER_URL="${FILESERVER_URL:-http://fileserver-upload.fileserver-system.svc:8082}"
          file=out/bootiso/install.iso
          # the default image keeps the plain name; the offline image has `offline` in it
          name=github-runner-bootc-latest.iso; [[ "$VARIANT" == offline ]] && name=github-runner-offline-bootc-latest.iso
          sha="$(sha256sum "$file" | cut -d' ' -f1)"
          # the same name replaces the file, written atomically on the server
          curl --fail --retry 3 --max-time 3600 -T "$file" -H "Authorization: Bearer $FILESERVER_TOKEN" -H "X-Content-SHA256: $sha" \
            "$FILESERVER_URL/v1/files/$name?visibility=public"
          echo "Uploaded \`$name\` from \`$TAG\` (public)" >> "$GITHUB_STEP_SUMMARY"
