      <stop offset="0" stop-color="#16294d"/><stop offset="1" stop-color="#0b1426"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb2ff"/><stop offset="1" stop-color="#4f8cf0"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- boot/power ring -->
  <path d="M 352 262 A 300 300 0 1 0 672 262" fill="none" stroke="#4ade80" stroke-width="56" stroke-linecap="round"/>
  <line x1="512" y1="150" x2="512" y2="330" stroke="#4ade80" stroke-width="56" stroke-linecap="round"/>
  <!-- container cube -->
