  <g fill="none" stroke="#dbeafe" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 392 600 l 48 28"/><path d="M 392 650 l 48 28"/>
  </g>
  <circle cx="800" cy="800" r="118" fill="#f59e0b" stroke="#0f1b33" stroke-width="28"/>
  <path d="M752 800 l36 36 l64 -72" fill="none" stroke="#0f1b33" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
